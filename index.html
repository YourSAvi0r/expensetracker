async function dl(name,data){try{if(typeof claude!='undefined'){const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:name,data})}else{const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}toast('Saved '+name+'.','ok')}catch(e){toast(e&&e.code=='declined'?'Download cancelled.':'Download failed. Please try again.','wn')}}
function pdf(title,lines){const E=s=>String(s).replace(/[\\()]/g,'\\$&').replace(/[^\x20-\x7e]/g,'?'),pg=[];for(let i=0;i<lines.length;i+=48)pg.push(lines.slice(i,i+48));if(!pg.length)pg.push([]);
const o=['<</Type/Catalog/Pages 2 0 R>>',`<</Type/Pages/Kids[${pg.map((_,i)=>(5+i*2)+' 0 R').join(' ')}]/Count ${pg.length}>>`,'<</Type/Font/Subtype/Type1/BaseFont/Courier>>','<</Type/Font/Subtype/Type1/BaseFont/Courier-Bold>>'];
pg.forEach((p,i)=>{const s=`BT /F2 14 Tf 40 800 Td (${E(title)}) Tj ET\nBT /F1 9 Tf 40 780 Td 14 TL\n`+p.map(l=>`(${E(l)}) '`).join('\n')+'\nET';o.push(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${6+i*2} 0 R>>`,`<</Length ${s.length}>>\nstream\n${s}\nendstream`)});
let b='%PDF-1.4\n';const x=[];o.forEach((c,i)=>{x.push(b.length);b+=`${i+1} 0 obj\n${c}\nendobj\n`});const r=b.length;b+=`xref\n0 ${o.length+1}\n0000000000 65535 f \n`+x.map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${o.length+1}/Root 1 0 R>>\nstartxref\n${r}\n%%EOF`;return new Blob([b],{type:'application/pdf'})}

function fit(){document.querySelectorAll('.cx').forEach(el=>{const w=Math.floor(el.clientWidth);if(w>=240&&w!=(+el.dataset.w||620)){el.dataset.w=w;el.innerHTML=CHD[el.dataset.k](el.dataset.p,w)}})}
const bars=y=>chart('bars',y),daily=m=>chart('daily',m),loanChart=()=>DB.l.some(l=>l.u==U.id)?chart('loan',''):'';
/* customizable menu */
const DESC={dash:'Summary & charts',tx:'All your entries',cat:'Names & colours',loan:'Borrowed & lent',bud:'Monthly limits',notes:'Text, images, PDFs',an:'Reports & trends'};
const ordAll=l=>{const o=menuCfg().order;return[...l].sort((a,b)=>(o.indexOf(a)<0?99:o.indexOf(a))-(o.indexOf(b)<0?99:o.indexOf(b))||l.indexOf(a)-l.indexOf(b))};
const GRu=()=>{const c=menuCfg();return GR.map(g=>[g[0],ordAll(g[1]).filter(k=>k=='dash'||!c.hide.includes(k))]).filter(g=>g[1].length)};
const setM=fn=>{U.menu=fn(menuCfg());save();app();drawCust()};
function drawCust(){const c=menuCfg(),e=$('#cm');if(!e)return;e.innerHTML=`<div class="sec">Menu style</div><div class="mg2"><button class="${c.m=='full'?'on':''}" data-a="mstyle" data-i="full"><b>Detailed</b><span>Icons, names and descriptions</span></button><button class="${c.m=='mini'?'on':''}" data-a="mstyle" data-i="mini"><b>Compact</b><span>Icons only, more room</span></button></div><label style="flex-direction:row;align-items:center;gap:8px;margin-top:10px"><input type="checkbox" style="width:auto" ${c.desc?'checked':''} data-a="mdesc">Show short descriptions under names</label><div class="sec">Items, order and visibility</div>${GR.map(g=>`<div class="mu" style="font-size:11px;margin-top:6px">${g[0]}</div>`+ordAll(g[1]).map(k=>{const off=k!='dash'&&c.hide.includes(k);return`<div class="cr ${off?'off':''}"><span>${I(k)}${NAV.find(n=>n[0]==k)[1]}</span><button class="ib" data-a="mmv" data-i="${k}:-1" title="Move up">↑</button><button class="ib" data-a="mmv" data-i="${k}:1" title="Move down">↓</button>${k=='dash'?'<span class="chip" style="flex:none">Always on</span>':`<button class="ib" data-a="mtog" data-i="${k}" title="Show or hide">${I(off?'eyeoff':'eye')}</button>`}</div>`}).join('')).join('')}<div style="margin-top:12px"><button class="btn o sm" data-a="mreset">Reset to default</button></div>`}
A.cust=w=>{modal(w?'Welcome! Set up your menu':'Customize menu',`<p class="mu" style="margin:0">${w?'Your menu is shown in detail. Choose how it looks and which items you want. You can change this anytime in Settings → Customize menu.':'Choose the menu style, which items to show, and their order.'}</p><div id="cm"></div>`);drawCust()};
A.mstyle=m=>setM(c=>({...c,m}));A.mdesc=()=>setM(c=>({...c,desc:!c.desc}));A.mtog=k=>setM(c=>({...c,hide:c.hide.includes(k)?c.hide.filter(x=>x!=k):[...c.hide,k]}));A.mreset=()=>setM(()=>({m:'full',hide:[],order:[],desc:true}));
A.mmv=q=>{const[k,d]=q.split(':'),g=GR.find(x=>x[1].includes(k))[1],o=ordAll(g),i=o.indexOf(k),j=i+ +d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];setM(c=>({...c,order:[...c.order.filter(x=>!g.includes(x)),...o]}))};
